LOOP CLOSURE HANDLER

INPUT:  current pose x_current
        current landmark observations
        pose graph G = {poses, edges}

═══════════════════════════════════════════════════════════
STAGE 1: DETECT LOOP CLOSURE CANDIDATES
═══════════════════════════════════════════════════════════

candidates = []

FOR each previous pose x_i in pose graph:

    # ignore recent poses — not a loop closure, just normal movement
    IF |current_index - i| < MIN_TEMPORAL_GAP:
        continue

    # check if the rover has been physically close to this pose before
    IF distance(x_current, x_i) < PROXIMITY_THRESHOLD:
        candidates.append(x_i)

# no nearby previously visited places found, nothing to do
IF candidates is empty:
    RETURN

═══════════════════════════════════════════════════════════
STAGE 2: VALIDATE A MATCH
═══════════════════════════════════════════════════════════

best_match     = None
best_transform = None
best_inliers   = []

FOR each candidate x_i in candidates:

    # get landmarks previously seen at x_i
    stored_landmarks = map.get_landmarks_at(x_i)

    # match current observations to stored landmarks
    matched_pairs = match_landmarks(current_observations, stored_landmarks)

    # too few matches — unreliable, skip this candidate
    IF len(matched_pairs) < MIN_MATCH_COUNT:
        continue

    # RANSAC — finds the best relative transform between the two poses
    # while filtering out incorrect landmark matches
    # -------------------------------------------------------
    # RANSAC — find best transform while rejecting wrong matches
    # -------------------------------------------------------

    best_inliers = []
    best_T       = None

    REPEAT MAX_ITERATIONS times:

        # pick 3 random pairs and compute transform from them
        subset      = random_sample(matched_pairs, n=3)
        T_candidate = compute_transform(subset)

        # test T_candidate against all pairs
        inliers = []
        FOR each pair in matched_pairs:

            # apply transform to stored landmark and see where it lands
            predicted = apply_transform(T_candidate, pair.landmark_before)
            error     = distance(predicted, pair.landmark_now)

            # consistent with T_candidate → inlier
            IF error < INLIER_DISTANCE_THRESHOLD:
                inliers.append(pair)

        # keep the transform that explains the most pairs
        IF len(inliers) > len(best_inliers):
            best_inliers = inliers
            best_T       = T_candidate

    # recompute final transform using only inliers for better accuracy
    best_T = compute_transform(best_inliers)
    # too many wrong matches — unreliable, skip this candidate
    IF len(inliers) / len(matched_pairs) < INLIER_THRESHOLD:
        continue

    # this candidate passed validation, store it
    best_match     = x_i
    best_transform = T
    best_inliers   = inliers

# no candidate passed validation, nothing to do
IF best_match is None:
    RETURN

═══════════════════════════════════════════════════════════
STAGE 3: ADD CONSTRAINT BETWEEN POSES
═══════════════════════════════════════════════════════════

# each edge stores:
#   pose_i   — start pose
#   pose_j   — end pose
#   z_ij     — measured relative transform between them
#   sigma_ij — uncertainty of the measurement
#              (more inliers = more confident = smaller sigma)

new_edge = {
    pose_i   : best_match,
    pose_j   : x_current,
    z_ij     : best_transform,
    sigma_ij : compute_covariance(best_inliers)
}

pose_graph.add_edge(new_edge)

═══════════════════════════════════════════════════════════
STAGE 4: GLOBAL OPTIMIZATION
═══════════════════════════════════════════════════════════

# adjust all poses so that every constraint is satisfied
# as well as possible at the same time

REPEAT:

    total_error = 0

    FOR each edge in pose_graph:

        # how far off is the current pose estimate from the measurement
        e_ij = edge.z_ij - compute_relative_transform(edge.pose_i, edge.pose_j)

        # weight the error by how confident the measurement is
        # small sigma (confident) → large contribution → optimizer focuses on it
        # large sigma (noisy)     → small contribution → optimizer relaxes about it
        weighted_error = e_ij^T * inverse(edge.sigma_ij) * e_ij

        total_error += weighted_error

        # compute how much each pose should be nudged to reduce this error
        adjustments[i], adjustments[j] = compute_gradient(e_ij, edge.sigma_ij)

    # apply all nudges at once
    FOR each pose x_i in pose_graph:
        x_i = x_i + adjustments[i]

UNTIL total_error < CONVERGENCE_THRESHOLD

# update the map using the corrected poses
# duplicate landmarks now merge into single consistent locations
FOR each landmark in map:
    landmark.position = recompute_position(landmark, updated_poses)