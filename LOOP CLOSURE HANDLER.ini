ALGORITHM: Loop Closure Handling

═══════════════════════════════════════════════════════
INPUT:  Current pose xn, pose graph G = (V, E)
        V = {x1, x2, ..., xn}  (all poses)
        E = {(i,j, zij, Σij)}  (all constraints)
OUTPUT: Corrected pose graph G* with consistent map
═══════════════════════════════════════════════════════

MAIN LOOP (runs at every new pose xn):

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
STAGE 1: DETECT LOOP CLOSURE CANDIDATES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

candidates = []

for each previous pose xk in V :

    // Spatial check: is xk physically close to xn?
    distance = || position(xn) - position(xk) ||

    IF distance < PROXIMITY_THRESHOLD:

        // Appearance check: do the landmarks/features look similar?
        similarity ← ComputeAppearanceSimilarity(xn, xk)

        IF similarity > SIMILARITY_THRESHOLD:
            candidates.append(xk)

RETURN candidates


━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
STAGE 2: VALIDATE EACH CANDIDATE MATCH
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

validated_matches = []

for each candidate xk in candidates:

    // Attempt to compute precise relative transform
    z_kn, Σ_kn ← EstimateRelativeTransform(xk, xn)

    IF estimation FAILED:
        CONTINUE  // skip this candidate

    // Geometric consistency check
    // Mahalanobis distance tests if the match is
    // statistically consistent with sensor noise model
    predicted  = xk_inv · xn          // from current pose estimates
    residual   = z_kn - (xk_inv . xn)
    match_score = residual^T · Σ_kn_inv · residual

    IF match_score < SCORE_THRESHOLD:    // e.g. chi-squared test at 95%

        // Optional: RANSAC-based geometric verification
        FUNCTION RANSAC_Verify(xk, xn, z_kn):

            features_k ← getFeaturesAt(xk)
            features_n ← getFeaturesAt(xn)

            // Find all candidate feature pairs between the two scans
            matches ← MatchFeatures(features_k, features_n)

            inliers ← 0

            REPEAT N times:

                // Randomly pick a small subset of matches
                sample ← RandomSample(matches, sample_size)

                // Estimate a transform from just this small sample
                T_candidate ← EstimateTransform(sample)

                // Count how many OTHER matches are consistent
                // with this candidate transform
                FOR each match (fk, fn) in matches:
                    error ← || fn - T_candidate · fk ||
                    IF error < INLIER_THRESHOLD:
                        inliers++

            RETURN inliers

        IF inlier_count > MIN_INLIERS:
            validated_matches.append( (xk, z_kn, Σ_kn) )

RETURN validated_matches


━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
STAGE 3: ADD LOOP CLOSURE CONSTRAINT TO POSE GRAPH
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

FOR each (xk, z_kn, Σ_kn) in validated_matches:

    // Create new edge in the pose graph
    new_edge = {
        from        : k,
        to          : n,
        measurement : z_kn,        // measured relative transform
        information : Σ_kn_inv     // = Σ_kn, weight of this constraint
    }

    E.add(new_edge)


━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
STAGE 4: GLOBAL POSE GRAPH OPTIMIZATION
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

FUNCTION OptimizePoseGraph(V, E):

    // Fix the first pose to remove gauge freedom
    // (the whole graph can drift freely otherwise)
    x1 = FIXED  (anchor)

    REPEAT until convergence:

        // Minimize the total weighted error across all constraints
        Δx = minimize: Σ e_ij^T · Σ_ij · e_ij
                  for all edges (i,j) in E
                  where e_ij = z_ij - (xi_inv · xj)

        // Update all poses based on the solution
        FOR each pose xi in V:
            xi = xi + Δxi

        IF ||Δx|| < THRESHOLD:
            BREAK

    RETURN updated V


━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
FULL PIPELINE CALL
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

FUNCTION HandleNewPose(xn, G):

    candidates = DetectCandidates(xn, G.V)
    validated = ValidateMatches(xn, candidates)

    IF validated is not empty:
        AddConstraints(G.E, validated)
        G.V = OptimizePoseGraph(G.V, G.E)

    RETURN G